<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>社内ツールポータル</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;family=Noto+Serif+JP:wght@700&amp;display=swap">
<style>
  :root{
    --ground:#F6F3EC; --paper:#FFFFFF; --ink:#1E2A30; --muted:#4A5660;
    --line:#DDD7CB; --accent:#1F5F5B; --accent-dark:#163F3C; --tint:#E4EFED;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:'Noto Sans JP',sans-serif;line-height:1.6}
  .wrap{max-width:1080px;margin:0 auto;padding:56px 24px 72px}
  header{margin-bottom:40px}
  .eyebrow{margin:0 0 8px;font-size:14px;font-weight:700;letter-spacing:.12em;color:var(--accent)}
  h1{margin:0 0 8px;font-family:'Noto Serif JP',serif;font-size:clamp(30px,5vw,42px);line-height:1.3}
  .lead{margin:0;font-size:17px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;list-style:none;margin:0;padding:0}
  .card{display:flex;flex-direction:column;gap:12px;height:100%;padding:24px;background:var(--paper);border:1px solid var(--line);border-radius:16px;color:inherit;text-decoration:none;transition:border-color .15s,box-shadow .15s}
  .card:hover,.card:focus-visible{border-color:var(--accent);box-shadow:0 4px 16px rgba(31,95,91,.12);outline:none}
  .icon{width:48px;height:48px;border-radius:12px;background:var(--tint);color:var(--accent);display:flex;align-items:center;justify-content:center}
  .tag{align-self:flex-start;font-size:12px;font-weight:700;color:var(--accent);background:var(--tint);border-radius:999px;padding:2px 10px}
  .card h2{margin:0;font-size:20px;line-height:1.4}
  .card p{margin:0;font-size:15px;color:var(--muted)}
  .open{margin-top:auto;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:var(--accent)}
  .card:hover .open{color:var(--accent-dark)}
  footer{margin-top:48px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">PORTAL</p>
    <h1>社内ツールポータル</h1>
    <p class="lead">営業で使う資料とツールの一覧です。見たいものを選んでください。</p>
  </header>

  <main>
    <ul class="grid">

      <li>
        <a class="card" href="./counseling/">
          <span class="icon" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          </span>
          <span class="tag">研修資料</span>
          <h2>心理カウンセリング問答体系</h2>
          <p>質問で顧客自身に課題と解決策を言葉にしてもらう4ステップと、よくある抵抗への切り返し集。</p>
          <span class="open">開く
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          </span>
        </a>
      </li>

      <!--
        ▼ 資料を追加するときは、下の <li> 〜 </li> をコピーして上の </li> の後に貼り付け、
          href（フォルダ名）・タグ・タイトル・説明文を書き換えてください。

      <li>
        <a class="card" href="./フォルダ名/">
          <span class="icon" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path></svg>
          </span>
          <span class="tag">ツール</span>
          <h2>資料のタイトル</h2>
          <p>資料の説明文。</p>
          <span class="open">開く
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          </span>
        </a>
      </li>
      -->

    </ul>
  </main>

  <footer>資料を追加・変更したときは、このページのリンクも更新してください。</footer>
</div>
</body>
</html>
